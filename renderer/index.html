<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYRON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="bg"></canvas><div class="aura"></div>

<div id="boot">
  <div>
    <img class="bm" src="icon.svg" alt="">
    <h1>VYRON</h1>
    <p id="bootMsg">Starting the backend…</p>
    <div class="bar live"><i style="width:100%"></i></div>
  </div>
</div>

<div id="shell">
  <aside id="side">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="">
      <div><b>VYRON</b><small>Claude game studio</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main">
    <header id="top">
      <button class="nav-toggle" data-act="toggleNav" title="Show or hide the sidebar (Ctrl+B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
      <div><h1 id="title">Dashboard</h1></div>
      <span class="sub" id="subtitle"></span>
      <div class="grow"></div>
      <div id="topActions" class="row"></div>
      <div class="winctl">
        <button data-host="minimize" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <button data-host="toggleMaximize" title="Maximize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button data-host="close" class="x" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </header>
    <section id="page"></section>
  </main>
</div>
<div id="lockRoot"></div>
<div id="setupRoot"></div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="look.js"></script>
<script src="app.js"></script>
<script src="setup.js"></script>
</body>
</html>
