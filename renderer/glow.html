<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>VYRON is using your computer</title>
<style>
  /* Purple glow on every side of the screen while VYRON uses the computer. Click-through (set by the window). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .edge { position: fixed; inset: 0; pointer-events: none; border-radius: 0;
    box-shadow: inset 0 0 0 3px rgba(178, 102, 255, .95), inset 0 0 28px 8px rgba(160, 80, 255, .75), inset 0 0 90px 24px rgba(140, 60, 255, .35);
    animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .75 } 50% { opacity: 1 } }
  .pill { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 12px; border-radius: 999px; color: #fff; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; white-space: nowrap;
    background: linear-gradient(135deg, rgba(126, 58, 242, .95), rgba(168, 85, 247, .95)); box-shadow: 0 6px 26px rgba(140, 60, 255, .55), 0 0 0 1px rgba(255, 255, 255, .18) inset; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35 } }
  .stop { font-weight: 500; opacity: .85; padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .35); }
  kbd { font: inherit; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .edge, .dot { animation: none } }
</style>
</head>
<body>
  <div class="edge"></div>
  <div class="pill"><span class="dot"></span><span>VYRON is using your computer</span><span class="stop">Stop: <kbd id="k">Ctrl+Alt+X</kbd></span></div>
  <script>const k = new URLSearchParams(location.search).get("stop"); if (k) document.getElementById("k").textContent = k;</script>
</body>
</html>
