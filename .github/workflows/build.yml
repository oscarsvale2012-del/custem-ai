name: Build Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        continue-on-error: true  # some checks need roblox.com / Roblox Studio, which CI may not reach

      - name: Build installer and portable .exe
        run: npx electron-builder --win --publish never

      - name: Upload .exe files
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-Windows
          path: dist/*.exe

      - name: Attach to GitHub Release (only for tags like v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
